<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>DISCMAGIC.ART | Расчет Реставрации</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=Geist:wght@100..900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000000; color: #e2e2e2; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card:hover { border-color: #0033AD; box-shadow: 0 0 20px rgba(0, 51, 173, 0.2); }
        .neon-button:hover { box-shadow: 0 0 25px rgba(0, 51, 173, 0.5); transform: scale(1.02); }
        .step-inactive { opacity: 0; pointer-events: none; position: absolute; visibility: hidden; }
        .step-active { opacity: 1; pointer-events: auto; position: relative; visibility: visible; }
        .reveal-layer { opacity: 0; transition: opacity 0.4s ease; }
        .group:hover .reveal-layer { opacity: 1; }
    </style>
</head>
<body class="font-sans">

<main class="min-h-screen pt-40 pb-20 px-8 flex flex-col items-center">
    <header class="max-w-4xl w-full text-center mb-16" id="quiz-header">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-6">Узнайте стоимость реставрации ваших дисков</h1>
    </header>

    <div class="w-full max-w-6xl glass-card p-10 rounded-xl relative" id="main-container">
        <form id="quiz-form">
            <!-- Шаг 1 -->
            <div class="step-active" id="step-1">
                <h2 class="text-2xl text-white mb-10 text-center">В каком состоянии диски?</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <label class="cursor-pointer">
                        <input class="hidden peer" name="disk_state" type="radio" value="Сколы и царапины" required>
                        <div class="glass-card p-6 peer-checked:border-blue-700">Сколы и царапины</div>
                    </label>
                    <label class="cursor-pointer">
                        <input class="hidden peer" name="disk_state" type="radio" value="Погнут диск">
                        <div class="glass-card p-6 peer-checked:border-blue-700">Погнут диск</div>
                    </label>
                    <label class="cursor-pointer">
                        <input class="hidden peer" name="disk_state" type="radio" value="Облупилась краска">
                        <div class="glass-card p-6 peer-checked:border-blue-700">Облупилась краска</div>
                    </label>
                </div>
            </div>

            <!-- Шаг 2 -->
            <div class="step-inactive" id="step-2">
                <h2 class="text-2xl text-white mb-10 text-center">Диаметр дисков?</h2>
                <div class="grid grid-cols-4 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="radius" value="R16" class="hidden peer" required>
                        <div class="glass-card p-4 text-center peer-checked:border-blue-700">R16</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="radius" value="R17" class="hidden peer">
                        <div class="glass-card p-4 text-center peer-checked:border-blue-700">R17</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="radius" value="R18" class="hidden peer">
                        <div class="glass-card p-4 text-center peer-checked:border-blue-700">R18</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="radius" value="R19" class="hidden peer">
                        <div class="glass-card p-4 text-center peer-checked:border-blue-700">R19</div>
                    </label>
                </div>
            </div>

            <!-- Шаг 3 -->
            <div class="step-inactive" id="step-3">
                <h2 class="text-2xl text-white mb-10 text-center">Контактные данные</h2>
                <div class="flex flex-col gap-6">
                    <input name="name" placeholder="Ваше имя" class="bg-transparent border-b border-gray-700 p-4 text-white" required>
                    <input name="phone" placeholder="Ваш телефон" class="bg-transparent border-b border-gray-700 p-4 text-white" required>
                    <button type="submit" id="submit-btn" class="bg-blue-700 text-white p-4 rounded-lg neon-button">ОТПРАВИТЬ ЗАЯВКУ</button>
                </div>
            </div>
        </form>

        <div id="thank-you-screen" class="hidden text-center py-10">
            <h2 class="text-3xl text-white">Спасибо! Заявка принята.</h2>
        </div>
    </div>
</main>

<script>
const WORKER_URL = 'https://orange-silence-8fea.verariq.workers.dev/';
const quizForm = document.getElementById('quiz-form');
const submitBtn = document.getElementById('submit-btn');

// Логика переключения шагов (упрощенная)
let step = 1;
quizForm.addEventListener('change', (e) => {
    if(e.target.name === 'disk_state') { document.getElementById('step-1').classList.replace('step-active', 'step-inactive'); document.getElementById('step-2').classList.replace('step-inactive', 'step-active'); }
    if(e.target.name === 'radius') { document.getElementById('step-2').classList.replace('step-active', 'step-inactive'); document.getElementById('step-3').classList.replace('step-inactive', 'step-active'); }
});

// Отправка через Worker
quizForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = 'ОТПРАВКА...';
    
    const formData = new FormData(quizForm);
    const data = Object.fromEntries(formData.entries());

    try {
        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            quizForm.classList.add('hidden');
            document.getElementById('thank-you-screen').classList.remove('hidden');
        } else {
            alert('Ошибка сервера. Попробуйте еще раз.');
        }
    } catch (err) {
        alert('Ошибка сети.');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'ОТПРАВИТЬ ЗАЯВКУ';
    }
});
</script>
</body>
</html>
